name: Generate otoriyose posts

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in JST as YYYY-MM-DD. Defaults to today in JST."
        required: false
        default: ""
        type: string
      count:
        description: "Number of posts to generate."
        required: true
        default: 3
        type: number

permissions:
  contents: read

concurrency:
  group: threads-otoriyose-generate
  cancel-in-progress: false

jobs:
  generate-posts:
    runs-on: ubuntu-latest

    env:
      SUBMODULE_PATH: th
      SUBMODULE_BRANCH: main
      TH_REPOSITORY: shamaton/threads
      GOPRIVATE: github.com/shamaton/*
      TZ: Asia/Tokyo

    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure required secrets are configured
        env:
          TH_TOKEN: ${{ secrets.TRIGGERS_REPO_PAT }}
          R_APP_ID: ${{ secrets.R_APP_ID }}
          R_AFF_ID: ${{ secrets.R_AFF_ID }}
          R_ACCESS_KEY: ${{ secrets.R_ACCESS_KEY }}
          R_HTTP_REFERER: ${{ secrets.R_HTTP_REFERER }}
        run: |
          missing=()
          [[ -n "$TH_TOKEN" ]] || missing+=(TRIGGERS_REPO_PAT)
          [[ -n "$R_APP_ID" ]] || missing+=(R_APP_ID)
          [[ -n "$R_AFF_ID" ]] || missing+=(R_AFF_ID)
          [[ -n "$R_ACCESS_KEY" ]] || missing+=(R_ACCESS_KEY)
          [[ -n "$R_HTTP_REFERER" ]] || missing+=(R_HTTP_REFERER)

          if (( ${#missing[@]} > 0 )); then
            printf 'Required secret is not configured: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Configure git
        env:
          TH_TOKEN: ${{ secrets.TRIGGERS_REPO_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${TH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Checkout latest threads branch
        env:
          TH_TOKEN: ${{ secrets.TRIGGERS_REPO_PAT }}
        run: |
          git submodule sync -- "$SUBMODULE_PATH"
          git config "submodule.${SUBMODULE_PATH}.url" "https://x-access-token:${TH_TOKEN}@github.com/${TH_REPOSITORY}.git"
          git submodule update --init -- "$SUBMODULE_PATH"

          git -C "$SUBMODULE_PATH" remote set-url origin "https://x-access-token:${TH_TOKEN}@github.com/${TH_REPOSITORY}.git"
          git -C "$SUBMODULE_PATH" fetch origin "$SUBMODULE_BRANCH"
          git -C "$SUBMODULE_PATH" checkout -B "$SUBMODULE_BRANCH" "origin/$SUBMODULE_BRANCH"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.SUBMODULE_PATH }}/go.mod
          cache: false

      - name: Resolve generation parameters
        id: parameters
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          target_date="$INPUT_TARGET_DATE"
          if [[ -z "$target_date" ]]; then
            target_date="$(date +'%Y-%m-%d')"
          fi
          if ! [[ "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "target_date must be YYYY-MM-DD: $target_date"
            exit 1
          fi
          if ! [[ "$INPUT_COUNT" =~ ^[0-9]+$ ]] || (( INPUT_COUNT < 1 || INPUT_COUNT > 30 )); then
            echo "count must be between 1 and 30: $INPUT_COUNT"
            exit 1
          fi

          branch="automation/otoriyose-${target_date}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "count=$INPUT_COUNT" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Ensure no generation PR is awaiting review
        env:
          GH_TOKEN: ${{ secrets.TRIGGERS_REPO_PAT }}
        run: |
          open_pr_count="$(gh pr list \
            --repo "$TH_REPOSITORY" \
            --state open \
            --limit 100 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("automation/otoriyose-"))] | length')"
          if (( open_pr_count > 0 )); then
            echo "An otoriyose generation PR is already awaiting review."
            exit 1
          fi

      - name: Generate posts
        env:
          R_APP_ID: ${{ secrets.R_APP_ID }}
          R_AFF_ID: ${{ secrets.R_AFF_ID }}
          R_ACCESS_KEY: ${{ secrets.R_ACCESS_KEY }}
          R_HTTP_REFERER: ${{ secrets.R_HTTP_REFERER }}
          TARGET_DATE: ${{ steps.parameters.outputs.target_date }}
          POST_COUNT: ${{ steps.parameters.outputs.count }}
          BRANCH: ${{ steps.parameters.outputs.branch }}
        run: |
          git -C "$SUBMODULE_PATH" switch -c "$BRANCH"
          go -C "$SUBMODULE_PATH" run ./accounts/otoriyose/cmd/otoriyose \
            generate --date "$TARGET_DATE" --count "$POST_COUNT"

      - name: Commit and push generated posts
        env:
          TARGET_DATE: ${{ steps.parameters.outputs.target_date }}
          BRANCH: ${{ steps.parameters.outputs.branch }}
        run: |
          git -C "$SUBMODULE_PATH" add -- accounts/otoriyose/data/posts
          if git -C "$SUBMODULE_PATH" diff --cached --quiet; then
            echo "Post generation did not create any changes."
            exit 1
          fi

          git -C "$SUBMODULE_PATH" commit -m "feat(otoriyose): generate posts for ${TARGET_DATE}"
          git -C "$SUBMODULE_PATH" push origin "HEAD:refs/heads/$BRANCH"

      - name: Create review pull request
        env:
          GH_TOKEN: ${{ secrets.TRIGGERS_REPO_PAT }}
          TARGET_DATE: ${{ steps.parameters.outputs.target_date }}
          POST_COUNT: ${{ steps.parameters.outputs.count }}
          BRANCH: ${{ steps.parameters.outputs.branch }}
        run: |
          body_file="$RUNNER_TEMP/otoriyose-pr-body.md"
          cat > "$body_file" <<EOF
          ## Summary

          - Generate ${POST_COUNT} otoriyose post records for ${TARGET_DATE} JST
          - Review the root and reply text, source evidence, price, and affiliate URL

          Merging this PR is the human approval required before publication.

          Generated by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
          EOF

          gh pr create \
            --repo "$TH_REPOSITORY" \
            --base "$SUBMODULE_BRANCH" \
            --head "$BRANCH" \
            --title "feat(otoriyose): generate posts for ${TARGET_DATE}" \
            --body-file "$body_file"
